<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoCyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Dark Circuit Base Board -->
  <rect x="8" y="8" width="84" height="84" rx="18" fill="#0f172a" stroke="url(#logoCyberGrad)" stroke-width="3"/>
  
  <!-- Outer Gold Pins on all 4 sides -->
  <!-- Top Pins -->
  <line x1="28" y1="2" x2="28" y2="8" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="2" x2="42" y2="8" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="2" x2="58" y2="8" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="2" x2="72" y2="8" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom Pins -->
  <line x1="28" y1="92" x2="28" y2="98" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="92" x2="42" y2="98" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="92" x2="58" y2="98" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="72" y1="92" x2="72" y2="98" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <!-- Left Pins -->
  <line x1="2" y1="28" x2="8" y2="28" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="2" y1="42" x2="8" y2="42" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="2" y1="58" x2="8" y2="58" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="2" y1="72" x2="8" y2="72" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <!-- Right Pins -->
  <line x1="92" y1="28" x2="98" y2="28" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="92" y1="42" x2="98" y2="42" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="92" y1="58" x2="98" y2="58" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <line x1="92" y1="72" x2="98" y2="72" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>

  <!-- Corner Notch / Pin 1 indicator -->
  <polygon points="12,24 24,12 12,12" fill="#facc15"/>

  <!-- Neon Circuit Traces -->
  <path d="M22 36 H32 V46" stroke="#00f3ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="22" cy="36" r="2.5" fill="#00f3ff"/>
  
  <path d="M78 36 H68 V46" stroke="#a855f7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="78" cy="36" r="2.5" fill="#a855f7"/>

  <path d="M22 64 H32 V54" stroke="#00f3ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="22" cy="64" r="2.5" fill="#00f3ff"/>

  <path d="M78 64 H68 V54" stroke="#a855f7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="78" cy="64" r="2.5" fill="#a855f7"/>

  <!-- Central Silicon Die / Processor Core -->
  <rect x="28" y="28" width="44" height="44" rx="10" fill="url(#coreGlow)" stroke="#00f3ff" stroke-width="2.5" filter="url(#neonGlow)"/>

  <!-- Internal Microarchitecture Grid Geometric Pattern -->
  <rect x="35" y="35" width="13" height="13" rx="3" fill="#0f172a" stroke="#67e8f9" stroke-width="1.5"/>
  <rect x="52" y="35" width="13" height="13" rx="3" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
  <rect x="35" y="52" width="13" height="13" rx="3" fill="#0f172a" stroke="#67e8f9" stroke-width="1.5"/>
  <rect x="52" y="52" width="13" height="13" rx="3" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>

  <!-- Center Diamond Quantum Glow Core -->
  <polygon points="50,44 56,50 50,56 44,50" fill="#ffffff" filter="drop-shadow(0 0 4px #00f3ff)"/>
</svg>