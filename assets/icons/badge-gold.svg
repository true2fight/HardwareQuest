  <circle cx="80" cy="75" r="44" fill="#0f172a" stroke="#fef08a" stroke-width="2"/>
  <circle cx="80" cy="75" r="38" fill="none" stroke="#facc15" stroke-dasharray="3,2"/>
  <!-- Star icon / Laurel -->
