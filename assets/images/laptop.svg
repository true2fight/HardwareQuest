  <!-- Screen content -->
  <polygon points="40,32 140,32 148,90 32,90" fill="#1e293b"/>
  <circle cx="90" cy="60" r="14" fill="#0284c7" opacity="0.5"/>
  <circle cx="90" cy="28" r="1.5" fill="#4ade80"/>
